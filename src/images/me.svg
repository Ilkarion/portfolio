<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Magnifying Glass Handle -->
  <path d="M315 315 L415 415 C425 425 440 425 450 415 C460 405 460 390 450 380 L350 280 Z" fill="#3b82f6" opacity="0.9" />
  <path d="M325 325 L405 405 C410 410 420 410 425 405 C430 400 430 390 425 385 L345 305 Z" fill="#60a5fa" />

  <!-- Outer Glass Ring -->
  <circle cx="220" cy="220" r="110" fill="none" stroke="url(#lensGrad)" stroke-width="20" filter="url(#glow)" />
  
  <!-- Lens Inner Background / Glow -->
  <circle cx="220" cy="220" r="95" fill="#0f172a" fill-opacity="0.6" />

  <!-- Bug Icon / Elements inside Lens -->
  <g transform="translate(165, 165)">
    <!-- Bug Body (Shield shape representing QA / testing) -->
    <path d="M55 20 C75 20 90 35 90 60 C90 85 75 95 55 100 C35 95 20 85 20 60 C20 35 35 20 55 20 Z" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="4" />
    
    <!-- Bug Head -->
    <circle cx="55" cy="25" r="14" fill="#38bdf8" />
    
    <!-- Antennae -->
    <path d="M45 15 L30 5 M65 15 L80 5" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    
    <!-- Legs -->
    <path d="M25 45 L5 35 M25 65 L2 65 M25 85 L10 100" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <path d="M85 45 L105 35 M85 65 L108 65 M85 85 L100 100" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

    <!-- Checkmark inside Bug (Green for passed tests/automation) -->
    <path d="M38 60 L48 70 L70 45" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  </g>

  <!-- Lens Glass Reflection -->
  <path d="M140 160 A 90 90 0 0 1 260 140" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.3" />
</svg>
